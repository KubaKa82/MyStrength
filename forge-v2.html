<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Strength Coach</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --surface3: #28282c;
  --border: #2e2e33;
  --border2: #3a3a40;
  --text: #f0efe8;
  --muted: #7a7a82;
  --hint: #4a4a52;
  --accent: #c8f060;
  --accent2: #a8d040;
  --accent-dim: rgba(200,240,96,0.12);
  --warm: #f0a060;
  --warm-dim: rgba(240,160,96,0.12);
  --info: #60a8f0;
  --info-dim: rgba(96,168,240,0.1);
  --danger: #f06060;
  --danger-dim: rgba(240,96,96,0.1);
  --success: #60d090;
  --radius: 10px;
  --radius-lg: 16px;
  --mono: 'DM Mono', monospace;
  --display: 'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:14px;line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── SETUP ── */
#setup-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem;max-width:460px;width:100%}
.setup-logo{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.setup-logo span{color:var(--accent)}
.setup-tagline{color:var(--muted);font-size:12px;margin-bottom:2rem;font-family:var(--mono)}
.setup-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.setup-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--text);font-family:var(--mono);outline:none;transition:border-color .2s;margin-bottom:1rem}
.setup-input:focus{border-color:var(--accent)}
.setup-hint{font-size:12px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:#0e0e0f;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;font-family:var(--display);cursor:pointer;transition:all .15s}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{background:var(--surface3);color:var(--hint);cursor:not-allowed}
.setup-error{background:var(--danger-dim);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--danger);margin-top:1rem;display:none;font-family:var(--mono)}
.setup-status{font-size:12px;color:var(--muted);margin-top:10px;font-family:var(--mono);text-align:center;min-height:18px}

/* ── APP ── */
#app{display:none;min-height:100vh;max-width:680px;margin:0 auto;padding:0 1rem 6rem}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0 1rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.topbar-logo{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.topbar-logo span{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.week-badge strong{color:var(--accent);font-weight:500}
.sync-indicator{font-size:11px;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.sync-dot.syncing{background:var(--warm);animation:pulse-dot 1s ease-in-out infinite}
.sync-dot.error{background:var(--danger)}
@keyframes pulse-dot{0%,100%{opacity:.4}50%{opacity:1}}
.settings-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:var(--muted);cursor:pointer;font-size:11px;font-family:var(--mono)}
.settings-btn:hover{border-color:var(--border2);color:var(--text)}

/* MESO BAR */
.meso-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
.meso-weeks{display:flex;gap:6px;flex:1}
.meso-week{flex:1;height:6px;border-radius:3px;background:var(--surface3);cursor:pointer;transition:opacity .15s}
.meso-week:hover{opacity:.8}
.meso-week.done{background:var(--accent)}
.meso-week.current{background:var(--accent);opacity:.5}
.meso-week.deload{background:var(--warm)}
.meso-week.deload.done{background:var(--warm)}
.meso-label{font-size:11px;font-family:var(--mono);color:var(--muted);white-space:nowrap}

/* DAY SELECTOR */
.day-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.day-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .15s;text-align:left}
.day-btn:hover{border-color:var(--border2)}
.day-btn.active{background:var(--accent-dim);border-color:var(--accent)}
.day-btn-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.day-btn-title{font-size:14px;font-weight:700;color:var(--text)}
.day-btn.active .day-btn-title{color:var(--accent)}
.day-btn-focus{font-size:11px;color:var(--muted);margin-top:2px}

/* SESSION META */
.session-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.meta-card label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.meta-card select,.meta-card input[type=date]{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;font-family:var(--mono);outline:none;cursor:pointer}
.meta-card select option{background:var(--surface2)}

/* COACH PANEL */
.coach-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:10px;display:none}
.coach-panel.visible{display:block}
.coach-header{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.coach-icon{width:28px;height:28px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.coach-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2}
.coach-title{font-size:13px;font-weight:700;color:var(--accent)}
.coach-body{font-size:13px;color:var(--muted);line-height:1.7;font-family:var(--mono);white-space:pre-wrap}
.coach-body strong{color:var(--text);font-weight:500}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-family:var(--mono)}
.thinking-dots span{display:inline-block;width:4px;height:4px;background:var(--accent);border-radius:50%;animation:pdots 1.2s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes pdots{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* EXERCISE CARD */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:10px;transition:border-color .2s}
.ex-card:hover{border-color:var(--border2)}
.ex-card-top{display:grid;grid-template-columns:72px 1fr;gap:14px;margin-bottom:1rem}
.ex-sketch svg{width:72px;height:72px}
.ex-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.ex-name{font-size:15px;font-weight:700;color:var(--text)}
.ex-muscles{font-size:10px;font-family:var(--mono);color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:20px;white-space:nowrap}
.ex-cue{font-size:12px;color:var(--muted);line-height:1.4}

/* WARMUP */
.section-tag{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.section-tag::after{content:'';flex:1;height:1px;background:var(--border)}
.warmup-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.warmup-pill{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;font-size:12px;font-family:var(--mono)}
.warmup-pill .pill-sets{color:var(--muted)}
.warmup-pill .pill-weight{color:var(--text);font-weight:500}
.warmup-pill .pill-note{color:var(--hint);font-size:10px}

/* SETS */
.target-chip{display:inline-block;background:var(--accent-dim);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;font-size:11px;font-family:var(--mono);color:var(--accent);margin-bottom:8px}
.sets-header{display:grid;grid-template-columns:24px 68px 1fr 1fr 86px;gap:6px;margin-bottom:4px}
.sets-header span{font-size:10px;font-family:var(--mono);color:var(--hint);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.set-row{display:grid;grid-template-columns:24px 68px 1fr 1fr 86px;gap:6px;align-items:center;margin-bottom:5px}
.set-num{font-size:12px;font-family:var(--mono);color:var(--hint);text-align:center}
.set-suggested{font-size:12px;font-family:var(--mono);color:var(--muted);text-align:center}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 6px;font-size:13px;font-family:var(--mono);color:var(--text);text-align:center;outline:none;width:100%;transition:border-color .15s}
.set-input:focus{border-color:var(--accent)}
.set-input::placeholder{color:var(--hint);font-size:11px}
.set-input.logged{border-color:var(--success);color:var(--success)}
.set-rpe select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 4px;font-size:11px;font-family:var(--mono);color:var(--muted);outline:none;cursor:pointer}
.set-rpe select option{background:var(--surface2)}
.ex-notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;font-family:var(--mono);color:var(--text);outline:none;margin-top:10px;transition:border-color .15s}
.ex-notes-input:focus{border-color:var(--border2)}
.ex-notes-input::placeholder{color:var(--hint)}

/* PROGRESS */
.section-title{font-size:13px;font-weight:700;color:var(--text);margin:1.5rem 0 .75rem;display:flex;align-items:center;gap:8px}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.pr-lift{font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.pr-weight{font-size:20px;font-weight:700;color:var(--text);font-family:var(--mono);line-height:1}
.pr-unit{font-size:11px;color:var(--muted);font-weight:400}
.pr-change{font-size:11px;font-family:var(--mono);margin-top:3px;color:var(--muted)}
.pr-change.up{color:var(--accent)}

/* HISTORY */
.history-empty{font-size:12px;font-family:var(--mono);color:var(--hint)}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-left{display:flex;flex-direction:column;gap:2px}
.history-date{font-size:11px;font-family:var(--mono);color:var(--muted)}
.history-day{font-size:13px;font-weight:500;color:var(--text)}
.history-summary{font-size:11px;font-family:var(--mono);color:var(--hint)}
.history-week{font-size:11px;font-family:var(--mono);color:var(--hint)}

/* BOTTOM BAR */
.analyse-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:1rem}
.analyse-bar-inner{max-width:680px;margin:0 auto;display:flex;gap:8px}
.btn-analyse{flex:1;padding:13px;background:var(--accent);color:#0e0e0f;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;font-family:var(--display);cursor:pointer;transition:all .15s}
.btn-analyse:hover{background:var(--accent2)}
.btn-analyse:disabled{background:var(--surface3);color:var(--hint);cursor:not-allowed}
.btn-clear{padding:13px 16px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted);font-family:var(--display);cursor:pointer;transition:all .15s}
.btn-clear:hover{border-color:var(--border2);color:var(--text)}

/* TOAST */
.toast{position:fixed;top:1rem;right:1rem;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:12px;font-family:var(--mono);color:var(--text);z-index:999;opacity:0;transform:translateY(-8px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

@media(max-width:480px){
  .session-meta{grid-template-columns:1fr 1fr}
  .set-row,.sets-header{grid-template-columns:20px 58px 1fr 1fr 76px}
  .progress-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">FORGE<span>.</span></div>
    <div class="setup-tagline">// claude-powered strength coach · synced across devices</div>

    <div class="setup-label">Anthropic API Key</div>
    <input type="password" class="setup-input" id="api-key-input" placeholder="sk-ant-...">

    <div class="setup-hint">Your key is stored locally and never shared. Get one at console.anthropic.com → API Keys.</div>

    <button class="btn-primary" id="setup-btn" onclick="setupApp()">Connect & start training</button>
    <div class="setup-error" id="setup-error"></div>
    <div class="setup-status" id="setup-status"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">FORGE<span>.</span></div>
    <div class="topbar-right">
      <div class="sync-indicator">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">synced</span>
      </div>
      <div class="week-badge">Week <strong id="week-display">1</strong> of 4</div>
      <button class="settings-btn" onclick="showSettings()">settings</button>
    </div>
  </div>

  <!-- MESO -->
  <div class="meso-bar">
    <div class="meso-weeks">
      <div class="meso-week" id="mw1" title="Week 1 — Accumulation" onclick="setWeek(1)"></div>
      <div class="meso-week" id="mw2" title="Week 2 — Intensification" onclick="setWeek(2)"></div>
      <div class="meso-week" id="mw3" title="Week 3 — Overreach" onclick="setWeek(3)"></div>
      <div class="meso-week deload" id="mw4" title="Week 4 — Deload" onclick="setWeek(4)"></div>
    </div>
    <div class="meso-label" id="meso-phase">Week 1 — Accumulation</div>
  </div>

  <!-- DAY SELECTOR -->
  <div class="day-selector">
    <button class="day-btn active" onclick="selectDay('a',this)">
      <div class="day-btn-label">Day A</div>
      <div class="day-btn-title">Squat</div>
      <div class="day-btn-focus">Quads · glutes · back</div>
    </button>
    <button class="day-btn" onclick="selectDay('b',this)">
      <div class="day-btn-label">Day B</div>
      <div class="day-btn-title">Hinge</div>
      <div class="day-btn-focus">Posterior · chest · arms</div>
    </button>
    <button class="day-btn" onclick="selectDay('c',this)">
      <div class="day-btn-label">Day C</div>
      <div class="day-btn-title">Press</div>
      <div class="day-btn-focus">Chest · shoulders · core</div>
    </button>
  </div>

  <!-- META -->
  <div class="session-meta">
    <div class="meta-card">
      <label>Date</label>
      <input type="date" id="session-date">
    </div>
    <div class="meta-card">
      <label>Energy</label>
      <select id="session-energy">
        <option>— select —</option>
        <option>Low</option>
        <option>Normal</option>
        <option>High</option>
      </select>
    </div>
    <div class="meta-card">
      <label>Missed sessions?</label>
      <select id="session-missed">
        <option>None</option>
        <option>1 session</option>
        <option>1 week</option>
        <option>2+ weeks</option>
      </select>
    </div>
  </div>

  <!-- COACH PANEL -->
  <div class="coach-panel" id="coach-panel">
    <div class="coach-header">
      <div class="coach-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="coach-title">Coach analysis</div>
    </div>
    <div class="coach-body" id="coach-body"></div>
  </div>

  <!-- EXERCISES -->
  <div id="exercises-container"></div>

  <!-- PROGRESS -->
  <div class="section-title">Current working weights</div>
  <div class="progress-grid" id="progress-grid"></div>

  <!-- HISTORY -->
  <div class="section-title" style="margin-top:2rem">Recent sessions</div>
  <div id="history-list"><div class="history-empty">No sessions logged yet.</div></div>

  <!-- BOTTOM BAR -->
  <div class="analyse-bar">
    <div class="analyse-bar-inner">
      <button class="btn-clear" onclick="clearSession()">Clear</button>
      <button class="btn-analyse" id="analyse-btn" onclick="analyseSession()">Analyse session →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

// ── STATE ────────────────────────────────────────────────────────────────────
let currentDay = 'a';
let appState = {
  week: 1,
  weights: {},
  sessions: []
};

// ── SUPABASE HELPERS ─────────────────────────────────────────────────────────
async function dbGet(key) {
  try {
    const { data } = await db.from('forge_data').select('value').eq('key', key).single();
    return data ? JSON.parse(data.value) : null;
  } catch { return null; }
}

async function dbSet(key, value) {
  setSyncState('syncing');
  try {
    await db.from('forge_data').upsert({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() }, { onConflict: 'key' });
    setSyncState('synced');
  } catch(e) {
    setSyncState('error');
    showToast('Sync failed — check connection', 'error');
  }
}

async function loadState() {
  setSyncState('syncing');
  try {
    const [w, weights, sessions] = await Promise.all([
      dbGet('week'), dbGet('weights'), dbGet('sessions')
    ]);
    if (w) appState.week = w;
    if (weights) appState.weights = weights;
    if (sessions) appState.sessions = sessions;
    setSyncState('synced');
  } catch {
    setSyncState('error');
  }
}

function setSyncState(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  label.textContent = state === 'syncing' ? 'syncing...' : state === 'error' ? 'offline' : 'synced';
}

// ── SETUP ────────────────────────────────────────────────────────────────────
async function setupApp() {
  const key = document.getElementById('api-key-input').value.trim();
  const errEl = document.getElementById('setup-error');
  const statusEl = document.getElementById('setup-status');
  const btn = document.getElementById('setup-btn');

  errEl.style.display = 'none';
  if (!key.startsWith('sk-')) {
    errEl.textContent = 'Key should start with sk-ant- or sk-';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connecting...';
  statusEl.textContent = 'Initialising database...';

  try {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ensure table exists by attempting an upsert
    const { error } = await db.from('forge_data').upsert(
      { key: 'init', value: '"ok"', updated_at: new Date().toISOString() },
      { onConflict: 'key' }
    );

    if (error && error.code === '42P01') {
      // Table doesn't exist yet
      errEl.innerHTML = 'Database table not found. Please run this SQL in your Supabase project:<br><br>' +
        '<code style="font-size:11px;display:block;background:var(--surface3);padding:8px;border-radius:4px;margin-top:6px;white-space:pre-wrap">' +
        'create table forge_data (\n  key text primary key,\n  value text,\n  updated_at timestamptz\n);\nalter table forge_data enable row level security;\ncreate policy "allow all" on forge_data for all using (true) with check (true);' +
        '</code><br>Then reload this page.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Connect & start training';
      statusEl.textContent = '';
      return;
    }

    localStorage.setItem('forge_api_key', key);
    statusEl.textContent = 'Loading your data...';
    await loadState();

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();

  } catch(e) {
    errEl.textContent = 'Connection failed: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Connect & start training';
    statusEl.textContent = '';
  }
}

function showSettings() {
  const newKey = prompt('Enter new Anthropic API key (leave blank to cancel):');
  if (newKey && newKey.trim()) {
    localStorage.setItem('forge_api_key', newKey.trim());
    showToast('API key updated', 'success');
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
function initApp() {
  document.getElementById('session-date').valueAsDate = new Date();
  updateWeekDisplay();
  renderExercises('a');
  renderProgress();
  renderHistory();
}

function setWeek(w) {
  appState.week = w;
  dbSet('week', w);
  updateWeekDisplay();
}

function updateWeekDisplay() {
  const w = appState.week;
  document.getElementById('week-display').textContent = w;
  const phases = {1:'Accumulation',2:'Intensification',3:'Overreach',4:'Deload'};
  document.getElementById('meso-phase').textContent = `Week ${w} — ${phases[w]}`;
  for (let i=1;i<=4;i++) {
    const el = document.getElementById('mw'+i);
    el.classList.remove('done','current');
    if (i < w) el.classList.add('done');
    else if (i === w) el.classList.add('current');
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function selectDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderExercises(day);
  hideCoach();
}

function getSuggested(exId, defaultWeight) {
  const w = appState.weights[exId];
  return (w !== undefined && w !== null) ? w : defaultWeight;
}

function renderExercises(day) {
  document.getElementById('exercises-container').innerHTML =
    PLAN[day].exercises.map(ex => renderExCard(ex)).join('');
}

function renderExCard(ex) {
  const sw = getSuggested(ex.id, ex.working.weight);
  const wDisplay = typeof sw === 'number' ? `${sw} ${ex.working.unit}`.trim() : `${sw} ${ex.working.unit}`.trim();

  const warmupHtml = ex.warmup.length ? `
    <div class="section-tag">Warm-up</div>
    <div class="warmup-pills">${ex.warmup.map(w=>`
      <div class="warmup-pill">
        <span class="pill-sets">${w.sets}</span>
        <span class="pill-weight">${w.weight}</span>
        ${w.note?`<span class="pill-note">${w.note}</span>`:''}
      </div>`).join('')}
    </div>` : '';

  const setsHtml = Array.from({length:ex.working.sets},(_,i)=>`
    <div class="set-row">
      <span class="set-num">${i+1}</span>
      <span class="set-suggested">${wDisplay}</span>
      <input class="set-input" placeholder="kg" id="${ex.id}-kg-${i}" oninput="markLogged(this)">
      <input class="set-input" placeholder="reps" id="${ex.id}-reps-${i}" oninput="markLogged(this)">
      <div class="set-rpe"><select id="${ex.id}-rpe-${i}">
        <option value="">RIR</option>
        <option value="rir3">RIR 3+</option>
        <option value="rir2">RIR 2</option>
        <option value="rir1">RIR 1</option>
        <option value="rir0">Max</option>
      </select></div>
    </div>`).join('');

  return `<div class="ex-card">
    <div class="ex-card-top">
      <div class="ex-sketch"><svg viewBox="0 0 72 72" fill="none">${ex.sketch}</svg></div>
      <div class="ex-meta">
        <div class="ex-name-row">
          <span class="ex-name">${ex.name}</span>
          <span class="ex-muscles">${ex.muscles}</span>
        </div>
        <div class="ex-cue">${ex.cue}</div>
      </div>
    </div>
    ${warmupHtml}
    <div class="section-tag">Working sets</div>
    <div class="target-chip">${ex.working.sets}×${ex.working.repRange} @ ${wDisplay}</div>
    <div class="sets-header"><span></span><span>Suggested</span><span>Actual kg</span><span>Reps</span><span>Effort</span></div>
    <div class="sets-grid">${setsHtml}</div>
    <input class="ex-notes-input" placeholder="Notes (form, pain, feel...)" id="${ex.id}-notes">
  </div>`;
}

function markLogged(input) {
  input.classList.toggle('logged', !!input.value);
}

function renderProgress() {
  const lifts = [
    {id:'squat',name:'Back squat',def:60},
    {id:'deadlift',name:'Deadlift',def:52.5},
    {id:'bench',name:'Bench',def:52.5},
    {id:'ohp',name:'OHP',def:20},
    {id:'row',name:'Row',def:30},
    {id:'incline',name:'Incline',def:50},
  ];
  document.getElementById('progress-grid').innerHTML = lifts.map(l => {
    const w = appState.weights[l.id] ?? l.def;
    const isNum = typeof w === 'number';
    return `<div class="pr-card">
      <div class="pr-lift">${l.name}</div>
      <div class="pr-weight">${w}<span class="pr-unit"> ${isNum?'kg':''}</span></div>
    </div>`;
  }).join('');
}

function renderHistory() {
  const el = document.getElementById('history-list');
  const sessions = appState.sessions || [];
  if (!sessions.length) {
    el.innerHTML = '<div class="history-empty">No sessions logged yet.</div>';
    return;
  }
  el.innerHTML = sessions.slice(-10).reverse().map(s=>`
    <div class="history-item">
      <div class="history-left">
        <div class="history-day">${s.day}</div>
        <div class="history-date">${s.date}</div>
      </div>
      <div class="history-summary">${s.summary}</div>
      <div class="history-week">Wk ${s.week||1}</div>
    </div>`).join('');
}

// ── SESSION ───────────────────────────────────────────────────────────────────
function collectLog() {
  const day = currentDay;
  const date = document.getElementById('session-date').value;
  const energy = document.getElementById('session-energy').value;
  const missed = document.getElementById('session-missed').value;

  let log = `SESSION LOG\nDay: ${PLAN[day].label}\nDate: ${date} | Week: ${appState.week}/4\nEnergy: ${energy} | Missed: ${missed}\n\n`;
  log += `ATHLETE: 85–86kg bodyweight, intermediate (1–3 yrs)\n\nCURRENT WEIGHTS:\n`;
  Object.entries(appState.weights).forEach(([k,v]) => { log += `  ${k}: ${v}\n`; });
  log += `\nSESSION:\n`;

  PLAN[day].exercises.forEach(ex => {
    const sw = getSuggested(ex.id, ex.working.weight);
    log += `\n${ex.name} (suggested: ${sw}, target: ${ex.working.sets}×${ex.working.repRange}):\n`;
    for (let i=0;i<ex.working.sets;i++) {
      const kg = document.getElementById(`${ex.id}-kg-${i}`)?.value;
      const reps = document.getElementById(`${ex.id}-reps-${i}`)?.value;
      const rpe = document.getElementById(`${ex.id}-rpe-${i}`)?.value;
      if (kg||reps) log += `  Set ${i+1}: ${kg||'?'}kg × ${reps||'?'} · ${rpe||'no RIR'}\n`;
    }
    const notes = document.getElementById(`${ex.id}-notes`)?.value;
    if (notes) log += `  Notes: ${notes}\n`;
  });
  return {log, date, day: PLAN[day].label};
}

// ── ANALYSE ───────────────────────────────────────────────────────────────────
async function analyseSession() {
  const apiKey = localStorage.getItem('forge_api_key');
  if (!apiKey) { showSettings(); return; }

  const {log, date, day} = collectLog();

  const panel = document.getElementById('coach-panel');
  const body = document.getElementById('coach-body');
  panel.classList.add('visible');
  panel.scrollIntoView({behavior:'smooth',block:'start'});
  body.innerHTML = `<div class="thinking">Analysing your session <div class="thinking-dots"><span></span><span></span><span></span></div></div>`;

  const btn = document.getElementById('analyse-btn');
  btn.disabled = true;
  btn.textContent = 'Analysing...';

  const system = `You are a strength coach for an intermediate lifter (85–86 kg, 1–3 yrs). They follow a 3-day full-body split, 4-week mesocycle (accumulate / intensify / overreach / deload wk4).

Progression rules:
- Main compounds: +2.5 kg when all sets hit top of rep range at RIR 2+. Hold weight if incomplete. Drop 5% if missed rep range.
- Missed 1 week → repeat weights. Missed 2+ weeks → drop 10%.
- Accessories: add reps before weight.

Respond with EXACTLY these four sections (use ** for headers):
**Session verdict** — 1–2 sentences overall.
**Lift by lift** — one line per logged lift. Flag anything notable.
**Next session weights** — list every exercise with exact warm-up sets AND working weight. Be specific.
**Watch out for** — 1–2 coaching cues for next session.

Be direct. Use kg. No fluff.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system,
        messages:[{role:'user',content:log}]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.content?.[0]?.text || '';
    body.innerHTML = text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');

    // Parse and save updated weights
    parseAndSaveWeights(text);

    // Save session to history
    const exercisesLogged = PLAN[currentDay].exercises.filter(ex =>
      document.getElementById(`${ex.id}-kg-0`)?.value
    ).length;
    const newSession = {date, day, summary:`${exercisesLogged} exercises`, week: appState.week};
    appState.sessions = [...(appState.sessions||[]), newSession];
    await dbSet('sessions', appState.sessions);
    renderHistory();
    showToast('Session saved', 'success');

  } catch(e) {
    body.innerHTML = `<span style="color:var(--danger)">Error: ${e.message}</span>`;
  }

  btn.disabled = false;
  btn.textContent = 'Analyse session →';
}

function parseAndSaveWeights(text) {
  // Extract weight updates from "Next session weights" section
  const nextSection = text.match(/Next session weights[\s\S]*?(?=\*\*|$)/i)?.[0] || '';
  const lines = nextSection.split('\n');
  const updated = {...appState.weights};
  let changed = false;

  const patterns = [
    {regex:/back squat[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'squat'},
    {regex:/deadlift[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'deadlift'},
    {regex:/bench[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'bench'},
    {regex:/overhead|ohp[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'ohp'},
    {regex:/pendlay|barbell row[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'row'},
    {regex:/romanian|rdl[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'rdl'},
    {regex:/incline[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'incline'},
    {regex:/split squat[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'bss'},
    {regex:/curl[^:]*working[^:]*:\s*(\d+(?:\.\d+)?)\s*kg/i, key:'curl'},
  ];

  // Also try simpler patterns per line
  lines.forEach(line => {
    patterns.forEach(p => {
      const m = line.match(p.regex) || line.match(new RegExp(p.regex.source.replace('[^:]*working[^:]*:\\s*','[^\\d]*'), 'i'));
      if (m) { updated[p.key] = parseFloat(m[1]); changed = true; }
    });
  });

  if (changed) {
    appState.weights = updated;
    dbSet('weights', updated);
    renderProgress();
    renderExercises(currentDay);
  }
}

function hideCoach() {
  document.getElementById('coach-panel').classList.remove('visible');
}

function clearSession() {
  document.querySelectorAll('.set-input').forEach(i => { i.value=''; i.classList.remove('logged'); });
  document.querySelectorAll('.set-rpe select').forEach(s => s.selectedIndex=0);
  document.querySelectorAll('.ex-notes-input').forEach(i => i.value='');
  hideCoach();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type?' '+type:'');
  setTimeout(()=>{ t.className='toast'; }, 2500);
}

(async () => {
  const savedKey = localStorage.getItem('forge_api_key');
  if (savedKey) {
    document.getElementById('api-key-input').value = savedKey;
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadState();
    initApp();
  }
})();
</script>
