<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<title>Forge</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --surface3: #28282c;
  --border: #2e2e33;
  --border2: #3a3a40;
  --text: #f0efe8;
  --muted: #7a7a82;
  --hint: #3e3e46;
  --accent: #c8f060;
  --accent2: #a8d040;
  --accent-dim: rgba(200,240,96,0.1);
  --accent-border: rgba(200,240,96,0.35);
  --warm: #f0a060;
  --danger: #f06060;
  --danger-dim: rgba(240,96,96,0.1);
  --success: #60d090;
  --radius: 12px;
  --radius-lg: 18px;
  --mono: 'DM Mono', monospace;
  --sans: 'Syne', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
input,select,button,textarea{font-family:var(--sans);font-size:16px}
::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#screen-setup.active{display:flex}
#screen-setup{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:2rem 1.5rem;padding-top:calc(2rem + var(--safe-top))}
.setup-logo span{color:var(--accent)}
.setup-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:2.5rem;text-align:center}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:400px}
.field-label{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;font-size:15px;font-family:var(--mono);color:var(--text);outline:none;-webkit-appearance:none;margin-bottom:6px}
.field-input:focus{border-color:var(--accent)}
.field-hint{font-size:12px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}
.field-hint a{color:var(--accent);text-decoration:none}
.btn-big{width:100%;padding:15px;background:var(--accent);color:#0d0d0e;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer;-webkit-appearance:none}
.btn-big:active{opacity:.85}
.setup-err{background:var(--danger-dim);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 12px;font-size:12px;font-family:var(--mono);color:var(--danger);margin-top:12px;display:none;line-height:1.5}
#screen-app{padding-bottom:calc(90px + var(--safe-bottom))}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 12px) 1rem 12px;display:flex;align-items:center;justify-content:space-between}
.tl{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.tl span{color:var(--accent)}
.tr{display:flex;align-items:center;gap:8px}
.week-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.week-pill b{color:var(--accent)}
.icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:16px}
.meso{margin:1rem 1rem .25rem;display:flex;align-items:center;gap:10px}
.meso-bars{display:flex;gap:5px;flex:1}
.meso-bar-item{flex:1;height:5px;border-radius:3px;background:var(--surface3);cursor:pointer}
.meso-bar-item.done{background:var(--accent)}
.meso-bar-item.active{background:var(--accent);opacity:.5}
.meso-bar-item.deload{background:var(--warm)}
.meso-bar-item.deload.done,.meso-bar-item.deload.active{background:var(--warm)}
.meso-label{font-size:10px;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.day-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:1rem 1rem .5rem}
.dtab{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;cursor:pointer;text-align:left;transition:all .12s}
.dtab.active{background:var(--accent-dim);border-color:var(--accent-border)}
.dtab-tag{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dtab-name{font-size:15px;font-weight:700;margin-top:1px}
.dtab.active .dtab-name{color:var(--accent)}
.dtab-focus{font-size:10px;color:var(--muted);margin-top:1px}
.meta-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 1rem .75rem}
.meta-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.meta-cell label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.meta-cell select,.meta-cell input[type=date]{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;font-family:var(--mono);outline:none;-webkit-appearance:none}
.meta-cell select option{background:var(--surface2)}
.coach-panel{margin:0 1rem .75rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:none}
.coach-panel.open{display:block}
.coach-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.coach-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.coach-dot.thinking{animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.coach-head-title{font-size:13px;font-weight:600;color:var(--accent)}
.coach-close{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
.coach-body{padding:12px 14px;font-size:13px;font-family:var(--mono);color:var(--muted);line-height:1.7;white-space:pre-wrap;max-height:280px;overflow-y:auto}
.coach-body strong{color:var(--text);font-weight:500}
.coach-input-row{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--border)}
.coach-input-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--mono);color:var(--text);outline:none}
.coach-input-row input:focus{border-color:var(--accent)}
.coach-input-row input::placeholder{color:var(--hint)}
.coach-send{background:var(--accent);border:none;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;color:#0d0d0e;font-weight:700}
.coach-send:active{opacity:.8}
.ex-card{margin:0 1rem .75rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.ex-top{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:14px 14px 10px}
.ex-sketch svg{width:68px;height:68px}
.ex-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-bottom:3px}
.ex-name{font-size:15px;font-weight:700;line-height:1.2}
.ex-muscles{font-size:9px;font-family:var(--mono);color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ex-cue{font-size:11px;color:var(--muted);line-height:1.4}
.ex-ask{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;font-family:var(--mono);color:var(--muted);cursor:pointer;margin-top:6px;width:fit-content}
.ex-ask:active{background:var(--surface2)}
.ex-ask::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.warmup-row{padding:0 14px 10px;display:flex;flex-direction:column;gap:4px}
.wu-label{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.wu-pills{display:flex;gap:5px;flex-wrap:wrap}
.wu-pill{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:11px;font-family:var(--mono);display:flex;align-items:center;gap:5px}
.wu-pill-sets{color:var(--muted)}
.wu-pill-w{color:var(--text);font-weight:500}
.wu-pill-note{color:var(--hint);font-size:9px}
.sets-section{padding:0 14px 14px}
.target-tag{display:inline-flex;align-items:center;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:20px;padding:3px 10px;font-size:11px;font-family:var(--mono);color:var(--accent);margin-bottom:8px}
.sets-head{display:grid;grid-template-columns:22px 62px 1fr 1fr 70px;gap:5px;margin-bottom:5px}
.sets-head span{font-size:9px;font-family:var(--mono);color:var(--hint);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.set-row{display:grid;grid-template-columns:22px 62px 1fr 1fr 70px;gap:5px;align-items:center;margin-bottom:6px}
.set-n{font-size:11px;font-family:var(--mono);color:var(--hint);text-align:center}
.set-sug{font-size:11px;font-family:var(--mono);color:var(--muted);text-align:center;line-height:1.2}
.set-inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 4px;font-size:14px;font-family:var(--mono);color:var(--text);text-align:center;outline:none;width:100%;-webkit-appearance:none}
.set-inp:focus{border-color:var(--accent)}
.set-inp::placeholder{color:var(--hint);font-size:11px}
.set-inp.ok{border-color:var(--success);color:var(--success)}
.set-rpe select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 2px;font-size:10px;font-family:var(--mono);color:var(--muted);outline:none;-webkit-appearance:none;text-align:center}
.set-rpe select option{background:var(--surface2)}
.ex-note-inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:var(--mono);color:var(--text);outline:none;margin-top:4px;-webkit-appearance:none}
.ex-note-inp::placeholder{color:var(--hint)}
.section-pad{padding:0 1rem}
.section-h{font-size:12px;font-weight:700;color:var(--text);margin:1rem 0 .5rem;text-transform:uppercase;letter-spacing:.04em}
.prog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem}
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.prog-lift{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.prog-w{font-size:18px;font-weight:700;font-family:var(--mono);line-height:1}
.prog-unit{font-size:10px;color:var(--muted);font-weight:400}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-l .hist-day{font-size:13px;font-weight:600}
.hist-l .hist-date{font-size:10px;font-family:var(--mono);color:var(--muted);margin-top:1px}
.hist-r{text-align:right}
.hist-r .hist-sum{font-size:11px;font-family:var(--mono);color:var(--muted)}
.hist-r .hist-wk{font-size:10px;font-family:var(--mono);color:var(--hint);margin-top:1px}
.hist-empty{font-size:12px;font-family:var(--mono);color:var(--hint);padding:.5rem 0}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg);border-top:1px solid var(--border);padding:10px 1rem calc(10px + var(--safe-bottom));display:flex;gap:8px}
.btn-analyse{flex:1;padding:14px;background:var(--accent);color:#0d0d0e;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;-webkit-appearance:none}
.btn-analyse:active{opacity:.85}
.btn-analyse:disabled{background:var(--surface3);color:var(--hint)}
.btn-clr{padding:14px 16px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted);font-family:var(--sans);cursor:pointer;-webkit-appearance:none}
.btn-clr:active{background:var(--surface2)}
.toast{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%) translateY(-8px);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:12px;font-family:var(--mono);color:var(--text);z-index:999;opacity:0;transition:all .2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--success);color:var(--success)}
.toast.err{border-color:var(--danger);color:var(--danger)}
.thinking-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dots span{display:inline-block;width:4px;height:4px;background:var(--accent);border-radius:50%;animation:dp 1.2s ease-in-out infinite;margin-right:2px}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div id="screen-setup" class="screen active">
  <div class="setup-logo">FORGE<span>.</span></div>
  <div class="setup-sub">// your claude-powered strength coach</div>
  <div class="setup-card">
    <label class="field-label">Anthropic API Key</label>
    <input type="password" class="field-input" id="api-key" placeholder="sk-ant-..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div class="field-hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys. Stored on this device only.</div>
    <button class="btn-big" onclick="startApp()">Start training</button>
    <div class="setup-err" id="setup-err"></div>
  </div>
</div>

<div id="screen-app" class="screen">
  <div class="topbar">
    <div class="tl">FORGE<span>.</span></div>
    <div class="tr">
      <div class="week-pill">Week <b id="wk-num">1</b> of 4</div>
      <div class="icon-btn" onclick="showSettings()">⚙</div>
    </div>
  </div>
  <div class="meso">
    <div class="meso-bars">
      <div class="meso-bar-item" id="mb1" onclick="setWeek(1)"></div>
      <div class="meso-bar-item" id="mb2" onclick="setWeek(2)"></div>
      <div class="meso-bar-item" id="mb3" onclick="setWeek(3)"></div>
      <div class="meso-bar-item deload" id="mb4" onclick="setWeek(4)"></div>
    </div>
    <div class="meso-label" id="meso-lbl">Wk 1 · Accumulation</div>
  </div>
  <div class="day-tabs">
    <button class="dtab active" onclick="switchDay('a',this)">
      <div class="dtab-tag">Day A</div>
      <div class="dtab-name">Squat</div>
      <div class="dtab-focus">Quads · glutes</div>
    </button>
    <button class="dtab" onclick="switchDay('b',this)">
      <div class="dtab-tag">Day B</div>
      <div class="dtab-name">Hinge</div>
      <div class="dtab-focus">Posterior · chest</div>
    </button>
    <button class="dtab" onclick="switchDay('c',this)">
      <div class="dtab-tag">Day C</div>
      <div class="dtab-name">Press</div>
      <div class="dtab-focus">Chest · shoulders</div>
    </button>
  </div>
  <div class="meta-strip">
    <div class="meta-cell"><label>Date</label><input type="date" id="sess-date"></div>
    <div class="meta-cell"><label>Energy</label>
      <select id="sess-energy"><option>—</option><option>Low</option><option>Normal</option><option>High</option></select>
    </div>
    <div class="meta-cell"><label>Missed?</label>
      <select id="sess-missed"><option>None</option><option>1 session</option><option>1 week</option><option>2+ weeks</option></select>
    </div>
  </div>
  <div class="coach-panel" id="coach-panel">
    <div class="coach-head">
      <div class="coach-dot" id="coach-dot"></div>
      <div class="coach-head-title" id="coach-title">Coach</div>
      <button class="coach-close" onclick="closeCoach()">×</button>
    </div>
    <div class="coach-body" id="coach-body"></div>
    <div class="coach-input-row">
      <input type="text" id="coach-input" placeholder="Ask anything — swap an exercise, form help..." autocorrect="off">
      <button class="coach-send" onclick="sendCoachMessage()">↑</button>
    </div>
  </div>
  <div id="ex-container"></div>
  <div class="section-pad">
    <div class="section-h">Working weights</div>
    <div class="prog-grid" id="prog-grid"></div>
    <div class="section-h">Recent sessions</div>
    <div id="hist-list"><div class="hist-empty">No sessions yet.</div></div>
  </div>
  <div style="height:1rem"></div>
  <div class="bottom-bar">
    <button class="btn-clr" onclick="clearAll()">Clear</button>
    <button class="btn-analyse" id="btn-analyse" onclick="analyseSession()">Analyse session →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLAN = {
  a:{label:'Day A — Squat focus',exercises:[
    {id:'squat',name:'Back squat',muscles:'quads · glutes',
     cue:'Bar on traps · chest up · knees track toes · break parallel',
     warmup:[{s:'2×5',w:'20 kg',n:'empty bar'},{s:'1×3',w:'40 kg'},{s:'1×2',w:'55 kg'}],
     work:{sets:4,rep:'4–6',wt:60,u:'kg'},
     sk:`<circle cx="36" cy="9" r="6" stroke="var(--text)" stroke-width="1.4" fill="none"/>
<line x1="36" y1="15" x2="36" y2="38" stroke="var(--text)" stroke-width="1.4"/>
<line x1="14" y1="27" x2="58" y2="27" stroke="var(--text)" stroke-width="2"/>
<rect x="5" y="23" width="9" height="7" rx="2" fill="var(--muted)" opacity=".5"/>
<rect x="58" y="23" width="9" height="7" rx="2" fill="var(--muted)" opacity=".5"/>
<line x1="28" y1="38" x2="18" y2="60" stroke="var(--text)" stroke-width="1.4"/>
<line x1="44" y1="38" x2="54" y2="60" stroke="var(--text)" stroke-width="1.4"/>
<line x1="18" y1="60" x2="13" y2="70" stroke="var(--text)" stroke-width="1.4"/>
<line x1="18" y1="60" x2="24" y2="70" stroke="var(--text)" stroke-width="1.4"/>
<line x1="54" y1="60" x2="48" y2="70" stroke="var(--text)" stroke-width="1.4"/>
<line x1="54" y1="60" x2="59" y2="70" stroke="var(--text)" stroke-width="1.4"/>`},
    {id:'ohp',name:'Overhead press',muscles:'shoulders · triceps',
     cue:'Strict · no leg drive · bar straight up · full lockout',
     warmup:[{s:'2×8',w:'20 kg',n:'bar only'}],
     work:{sets:3,rep:'6–8',wt:20,u:'kg'},
     sk:`<circle cx="36" cy="8" r="6" stroke="var(--text)" stroke-width="1.4" fill="none"/>
<line x1="36" y1="14" x2="36" y2="30" stroke="var(--text)" stroke-width="1.4"/>
<line x1="12" y1="22" x2="60" y2="22" stroke="var(--text)" stroke-width="2"/>
<rect x="3" y="18" width="9" height="7" rx="2" fill="var(--muted)" opacity=".5"/>
<rect x="60" y="18" width="9" height="7" rx="2" fill="var(--muted)" opacity=".5"/>
<line x1="36" y1="14" x2="36" y2="4" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="36" y1="30" x2="28" y2="50" stroke="var(--text)" stroke-width="1.4"/>
<line x1="36" y1="30" x2="44" y2="50" stroke="var(--text)" stroke-width="1.4"/>
<line x1="28" y1="50" x2="23" y2="68" stroke="var(--text)" stroke-width="1.4"/>
<line x1="28" y1="50" x2="33" y2="68" stroke="var(--text)" stroke-width="1.4"/>
<line x1="44" y1="50" x2="39" y2="68" stroke="var(--text)" stroke-width="1.4"/>
<line x1="44" y1="50" x2="49" y2="68" stroke="var(--text)" stroke-width="1.4"/>`},
    {id:'row',name:'Pendlay row',muscles:'upper back · biceps',
     cue:'Torso horizontal · pull to lower chest · reset each rep',
     warmup:[{s:'2×8',w:'20 kg',n:'bar only'},{s:'1×5',w:'27.5 kg'}],

let S={week:1,weights:{},sessions:[],coachHistory:[]};
let currentDay='a';
let coachContext='';

function load(){const d=localStorage.getItem('forge_state');if(d)try{S={...S,...JSON.parse(d)};}catch{}}
function save(){localStorage.setItem('forge_state',JSON.stringify(S));}
function getSuggested(id,def){return S.weights[id]!==undefined?S.weights[id]:def;}

function startApp(){
  const key=document.getElementById('api-key').value.trim();
  const err=document.getElementById('setup-err');
  if(!key.startsWith('sk-')){err.textContent='Key should start with sk-ant-';err.style.display='block';return;}
  localStorage.setItem('forge_key',key);
  err.style.display='none';
  showApp();
}

function showApp(){
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  window.scrollTo(0,0);
  document.getElementById('sess-date').valueAsDate=new Date();
  updateWeek();renderExercises(currentDay);renderProgress();renderHistory();
}

function showSettings(){
  const k=prompt('Enter new Anthropic API key (blank = cancel):');
  if(k&&k.trim().startsWith('sk-')){localStorage.setItem('forge_key',k.trim());toast('API key updated','ok');}
}

function setWeek(w){S.week=w;save();updateWeek();}
function updateWeek(){
  const w=S.week;
  document.getElementById('wk-num').textContent=w;
  const ph={1:'Accumulation',2:'Intensification',3:'Overreach',4:'Deload'};
  document.getElementById('meso-lbl').textContent=`Wk ${w} · ${ph[w]}`;
  for(let i=1;i<=4;i++){
    const el=document.getElementById('mb'+i);
    el.classList.remove('done','active');
    if(i<w)el.classList.add('done');
    else if(i===w)el.classList.add('active');
  }
}

function switchDay(d,btn){
  currentDay=d;
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderExercises(d);closeCoach();
}

function renderExercises(day){
  document.getElementById('ex-container').innerHTML=PLAN[day].exercises.map(ex=>buildCard(ex)).join('');
}

function buildCard(ex){
  const sw=getSuggested(ex.id,ex.work.wt);
  const wd=typeof sw==='number'?`${sw} ${ex.work.u}`.trim():`${sw}${ex.work.u?' '+ex.work.u:''}`.trim();
  const wu=ex.warmup.length?`<div class="warmup-row"><div class="wu-label">Warm-up</div><div class="wu-pills">${ex.warmup.map(w=>`<div class="wu-pill"><span class="wu-pill-sets">${w.s}</span><span class="wu-pill-w">${w.w}</span>${w.n?`<span class="wu-pill-note">${w.n}</span>`:''}</div>`).join('')}</div></div>`:'';
  const rows=Array.from({length:ex.work.sets},(_,i)=>`<div class="set-row"><span class="set-n">${i+1}</span><span class="set-sug">${wd}</span><input class="set-inp" type="number" inputmode="decimal" placeholder="kg" id="${ex.id}-kg-${i}" oninput="markOk(this)"><input class="set-inp" type="number" inputmode="numeric" placeholder="reps" id="${ex.id}-rp-${i}" oninput="markOk(this)"><div class="set-rpe"><select id="${ex.id}-rpe-${i}"><option value="">RIR</option><option>3+</option><option>2</option><option>1</option><option>0</option></select></div></div>`).join('');
  return `<div class="ex-card" id="card-${ex.id}"><div class="ex-top"><div class="ex-sketch"><svg viewBox="0 0 72 72" fill="none">${ex.sk}</svg></div><div class="ex-info"><div class="ex-name-row"><div class="ex-name">${ex.name}</div><div class="ex-muscles">${ex.muscles}</div></div><div class="ex-cue">${ex.cue}</div><button class="ex-ask" onclick="openCoachFor('${ex.id}','${ex.name}')">Ask coach / swap exercise</button></div></div>${wu}<div class="sets-section"><div class="target-tag">${ex.work.sets}×${ex.work.rep} @ ${wd}</div><div class="sets-head"><span></span><span>Suggested</span><span>Actual kg</span><span>Reps</span><span>Effort</span></div>${rows}<input class="ex-note-inp" placeholder="Notes (form, pain, feel...)" id="${ex.id}-note"></div></div>`;
}

function markOk(el){el.classList.toggle('ok',!!el.value);}

function renderProgress(){
  const lifts=[{id:'squat',n:'Squat',d:60},{id:'deadlift',n:'Deadlift',d:52.5},{id:'bench',n:'Bench',d:52.5},{id:'ohp',n:'OHP',d:20},{id:'row',n:'Row',d:30},{id:'incline',n:'Incline',d:50}];
  document.getElementById('prog-grid').innerHTML=lifts.map(l=>{const w=S.weights[l.id]??l.d;return`<div class="prog-card"><div class="prog-lift">${l.n}</div><div class="prog-w">${w}<span class="prog-unit"> ${typeof w==='number'?'kg':''}</span></div></div>`;}).join('');
}

function renderHistory(){
  const el=document.getElementById('hist-list');
  if(!S.sessions.length){el.innerHTML='<div class="hist-empty">No sessions yet.</div>';return;}
  el.innerHTML=S.sessions.slice(-8).reverse().map(s=>`<div class="hist-item"><div class="hist-l"><div class="hist-day">${s.day}</div><div class="hist-date">${s.date}</div></div><div class="hist-r"><div class="hist-sum">${s.summary}</div><div class="hist-wk">Week ${s.week||1}</div></div></div>`).join('');
}

function openCoachFor(exId,exName){
  coachContext=exName;S.coachHistory=[];
  document.getElementById('coach-title').textContent=exName;
  document.getElementById('coach-body').innerHTML=`<div style="color:var(--muted);font-size:12px">Ask me anything about ${exName} — swap it, form tips, or load questions.</div>`;
  document.getElementById('coach-panel').classList.add('open');
  document.getElementById('coach-input').focus();
  document.getElementById('coach-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function closeCoach(){document.getElementById('coach-panel').classList.remove('open');coachContext='';}

function sendCoachMessage(){
  const input=document.getElementById('coach-input');
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  chatWithCoach(msg);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='coach-input')sendCoachMessage();});

async function chatWithCoach(userMsg){
  const apiKey=localStorage.getItem('forge_key');
  if(!apiKey)return;
  const body=document.getElementById('coach-body');
  const dot=document.getElementById('coach-dot');
  body.innerHTML+=`<div style="color:var(--text);margin-top:8px"><span style="color:var(--hint)">You: </span>${userMsg}</div>`;
  S.coachHistory.push({role:'user',content:userMsg});
  const thinkId='think-'+Date.now();
  body.innerHTML+=`<div id="${thinkId}" class="thinking-row" style="margin-top:8px">Coach <div class="dots"><span></span><span></span><span></span></div></div>`;
  dot.classList.add('thinking');body.scrollTop=body.scrollHeight;
  const system=`You are a concise strength coach. Athlete: intermediate, 85–86 kg, 3-day full-body program. Week ${S.week}/4.${coachContext&&coachContext!=='general'?` Current exercise: ${coachContext}.`:''} Weights: ${JSON.stringify(S.weights)}. If asked to swap: suggest 1–2 alternatives hitting the same muscles, give starting weight. Form tips: 2–3 specific cues. Load questions: apply progression rules (+2.5 kg when all sets hit top of range at RIR 2+). Max 5 sentences unless swap needs more.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,system,messages:S.coachHistory})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.content?.[0]?.text||'';
    S.coachHistory.push({role:'assistant',content:reply});
    if(S.coachHistory.length>20)S.coachHistory=S.coachHistory.slice(-16);
    document.getElementById(thinkId)?.remove();
    body.innerHTML+=`<div style="margin-top:8px"><span style="color:var(--accent);font-size:10px;font-family:var(--mono)">COACH</span><br>${reply.replace(/\n/g,'<br>')}</div>`;
  }catch(e){
    document.getElementById(thinkId)?.remove();
    body.innerHTML+=`<div style="color:var(--danger);font-size:12px;margin-top:8px">Error: ${e.message}</div>`;
  }
  dot.classList.remove('thinking');body.scrollTop=body.scrollHeight;
}

function buildLog(){
  const day=currentDay;
  const date=document.getElementById('sess-date').value;
  const energy=document.getElementById('sess-energy').value;
  const missed=document.getElementById('sess-missed').value;
  let log=`SESSION LOG\nDay: ${PLAN[day].label}\nDate: ${date} | Week: ${S.week}/4\nEnergy: ${energy} | Missed: ${missed}\nAthlete: 85–86 kg, intermediate\n\nCurrent weights:\n`;
  Object.entries(S.weights).forEach(([k,v])=>{log+=`  ${k}: ${v}\n`;});
  log+='\nSets logged:\n';
  PLAN[day].exercises.forEach(ex=>{
    const sw=getSuggested(ex.id,ex.work.wt);
    log+=`\n${ex.name} (suggested: ${sw}, target: ${ex.work.sets}×${ex.work.rep}):\n`;
    for(let i=0;i<ex.work.sets;i++){
      const kg=document.getElementById(`${ex.id}-kg-${i}`)?.value;
      const rp=document.getElementById(`${ex.id}-rp-${i}`)?.value;
      const rpe=document.getElementById(`${ex.id}-rpe-${i}`)?.value;
      if(kg||rp)log+=`  Set ${i+1}: ${kg||'?'}kg × ${rp||'?'} reps · RIR ${rpe||'?'}\n`;
    }
    const note=document.getElementById(`${ex.id}-note`)?.value;
    if(note)log+=`  Notes: ${note}\n`;
  });
  return{log,date,day:PLAN[day].label};
}

async function analyseSession(){
  const apiKey=localStorage.getItem('forge_key');
  if(!apiKey){showSettings();return;}
  const{log,date,day}=buildLog();
  const panel=document.getElementById('coach-panel');
  const body=document.getElementById('coach-body');
  const dot=document.getElementById('coach-dot');
  document.getElementById('coach-title').textContent='Session analysis';
  coachContext='session-analysis';S.coachHistory=[];
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth',block:'start'});
  body.innerHTML=`<div class="thinking-row">Analysing your session <div class="dots"><span></span><span></span><span></span></div></div>`;
  dot.classList.add('thinking');
  const btn=document.getElementById('btn-analyse');
  btn.disabled=true;btn.textContent='Analysing...';
  const system=`You are a strength coach. Intermediate athlete, 85–86 kg, 3-day full-body split, 4-week mesocycle. Progression: +2.5 kg on main compounds when all sets hit top of rep range at RIR 2+. Hold if incomplete. Missed 1 week → repeat. Missed 2+ weeks → drop 10%. Accessories: reps before weight. Reply with exactly these four sections using ** for bold headers:\n**Session verdict** — 1–2 sentences.\n**Lift by lift** — one line per logged lift.\n**Next session weights** — every exercise with warm-up sets AND working weight. Be exact.\n**Focus for next session** — 1–2 specific cues.\nDirect. Use kg.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:[{role:'user',content:log}]})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const text=data.content?.[0]?.text||'';
    body.innerHTML=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    S.coachHistory=[{role:'user',content:log},{role:'assistant',content:text}];
    parseWeights(text);
    const logged=PLAN[currentDay].exercises.filter(ex=>document.getElementById(`${ex.id}-kg-0`)?.value).length;
    S.sessions.push({date,day,summary:`${logged} exercises logged`,week:S.week});
    save();renderHistory();renderProgress();toast('Session saved','ok');
  }catch(e){
    body.innerHTML=`<span style="color:var(--danger)">Error: ${e.message}</span>`;
  }
  dot.classList.remove('thinking');btn.disabled=false;btn.textContent='Analyse session →';
}

function parseWeights(text){
  const section=text.match(/Next session weights([\s\S]*?)(?=\*\*|$)/i)?.[1]||text;
  const lines=section.split('\n');
  const map={squat:/squat/i,deadlift:/deadlift/i,bench:/bench press/i,ohp:/overhead|ohp/i,row:/pendlay|barbell row/i,rdl:/romanian|rdl/i,incline:/incline/i,bss:/split squat/i,curl:/curl/i,frontsquat:/front squat/i,pullup:/pull.up/i};
  let changed=false;
  lines.forEach(line=>{
    const kg=line.match(/(\d+(?:\.\d+)?)\s*kg/i);
    if(!kg)return;
    if(!/working|4x|3x|×|\d+\s*×/i.test(line)&&!/:\s*\d/.test(line))return;
    Object.entries(map).forEach(([key,rx])=>{if(rx.test(line)){S.weights[key]=parseFloat(kg[1]);changed=true;}});
  });
  if(changed)save();
}

function clearAll(){
  document.querySelectorAll('.set-inp').forEach(i=>{i.value='';i.classList.remove('ok');});
  document.querySelectorAll('.set-rpe select').forEach(s=>s.selectedIndex=0);
  document.querySelectorAll('.ex-note-inp').forEach(i=>i.value='');
  closeCoach();
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',2500);
}

load();
const savedKey=localStorage.getItem('forge_key');
if(savedKey)showApp();
</script>
